<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Illustration of fresh bread, a croissant and a cake on a bakery counter">
  <!-- counter/shadow -->
  <ellipse cx="240" cy="330" rx="200" ry="30" fill="#e4d3ab" opacity="0.6"/>
  <circle cx="360" cy="90" r="70" fill="#F2E6D3"/>

  <!-- Bread loaf (left) -->
  <g>
    <path d="M70 300 C60 250 90 210 150 210 C210 210 240 250 230 300 Z" fill="#C68B45"/>
    <path d="M100 220 C105 210 115 210 118 222" stroke="#8B5A28" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M135 218 C140 206 152 206 155 220" stroke="#8B5A28" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M170 220 C175 210 185 210 188 222" stroke="#8B5A28" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Croissant (middle) -->
  <g transform="translate(190,255)">
    <path d="M0 30 C10 -10 60 -10 70 30 C55 20 45 30 35 20 C25 30 15 20 0 30 Z" fill="#E0A458"/>
  </g>

  <!-- Small cake with cherry (right) -->
  <g>
    <rect x="290" y="255" width="90" height="50" rx="8" fill="#5C3A21"/>
    <path d="M290 255 Q335 235 380 255 Q335 265 290 255 Z" fill="#FBEFD9"/>
    <circle cx="335" cy="238" r="8" fill="#B23A48"/>
    <rect x="330" y="228" width="3" height="10" fill="#5C3A21"/>
  </g>

  <!-- steam / warmth swirl above bread -->
  <path d="M110 195 Q120 175 108 160 Q100 148 112 132" stroke="#C9A24B" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
